name: Cassia app checks
on:
  push:
    branches: [main]
    paths:
      - 'Cassia_Operations_PWA_Vercel_Kit/Cassia_Operations_PWA/**'
      - '.github/workflows/cassia-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Cassia_Operations_PWA_Vercel_Kit/Cassia_Operations_PWA
    steps:
      - name: Get source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax and role tests
        run: npm run check
